name: Daily Football Betting Predictions

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  pre-lineup:
    name: Pre-Lineup Predictions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run pre-lineup prediction
        run: |
          DATE=$(date +%F)
          python fetch_live.py $DATE --source oddsportal --pass pre
      - name: Send Telegram summary
        if: always()
        run: python send_telegram.py pre
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pre-lineup-${{ github.run_id }}
          path: data/live_*_pre.parquet

  post-lineup:
    name: Post-Lineup Predictions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 12 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run post-lineup prediction
        run: |
          DATE=$(date +%F)
          python fetch_live.py $DATE --source oddsportal --pass post
      - name: Send Telegram summary
        if: always()
        run: python send_telegram.py post
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: post-lineup-${{ github.run_id }}
          path: data/live_*_post.parquet