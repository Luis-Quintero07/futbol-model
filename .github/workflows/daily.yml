name: Daily Football Betting Predictions

on:
  schedule:
    # Pre-lineup: 07:00 UTC (early morning Europe)
    - cron: '0 7 * * *'
    # Post-lineup: 12:30 UTC (~13:30-14:00 Europe, before afternoon kickoffs)
    - cron: '30 12 * * *'
  workflow_dispatch:  # Manual trigger - enables "Run workflow" button

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  pre-lineup:
    name: Pre-Lineup Predictions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run pre-lineup prediction
        run: |
          DATE=$(date +%F)
          python fetch_live.py $DATE --source oddsportal --pass pre
      - name: Send Telegram summary
        if: always()
        run: |
          python -c "
import os, pandas as pd
from pathlib import Path
DATA = Path('data')
files = sorted(DATA.glob('live_bets_*_pre.parquet'))
if files:
    df = pd.read_parquet(files[-1])
    if len(df) > 0:
        msg = f'📊 PRE-LINEUP {df.iloc[0][\"Date\"]}\n{len(df)} EV+ bets | Avg EV: {df[\"EV%\"].mean():.1f}% | Stake: {df[\"Stake%\"].sum():.1f}%\n'
        for _, r in df.iterrows():
            msg += f'{r[\"League\"]} {r[\"Home\"]} vs {r[\"Away\"]} | {r[\"Market\"]} @{r[\"Odds\"]:.2f} EV{r[\"EV%\"]:.1f}% Stake{r[\"Stake%\"]:.1f}%\n'
        import requests
        requests.post(f'https://api.telegram.org/bot{os.getenv(\"TELEGRAM_TOKEN\")}/sendMessage',
                      json={'chat_id': os.getenv('TELEGRAM_CHAT_ID'), 'text': msg})
"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pre-lineup-${{ github.run_id }}
          path: data/live_*_pre.parquet

  post-lineup:
    name: Post-Lineup Predictions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 12 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run post-lineup prediction
        run: |
          DATE=$(date +%F)
          python fetch_live.py $DATE --source oddsportal --pass post
      - name: Send Telegram summary
        if: always()
        run: |
          python -c "
import os, pandas as pd
from pathlib import Path
DATA = Path('data')
files = sorted(DATA.glob('live_bets_*_post.parquet'))
if files:
    df = pd.read_parquet(files[-1])
    if len(df) > 0:
        msg = f'🎯 POST-LINEUP {df.iloc[0][\"Date\"]}\n{len(df)} EV+ bets | Avg EV: {df[\"EV%\"].mean():.1f}% | Stake: {df[\"Stake%\"].sum():.1f}% | CLV: {df[\"CLV%\"].mean():.1f}%\n'
        for _, r in df.iterrows():
            msg += f'{r[\"League\"]} {r[\"Home\"]} vs {r[\"Away\"]} | {r[\"Market\"]} @{r[\"Odds\"]:.2f} EV{r[\"EV%\"]:.1f}% Stake{r[\"Stake%\"]:.1f}%\n'
        import requests
        requests.post(f'https://api.telegram.org/bot{os.getenv(\"TELEGRAM_TOKEN\")}/sendMessage',
                      json={'chat_id': os.getenv('TELEGRAM_CHAT_ID'), 'text': msg})
"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: post-lineup-${{ github.run_id }}
          path: data/live_*_post.parquet