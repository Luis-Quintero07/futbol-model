[project]
name = "futbol-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.3",
    "lxml-html-clean>=0.4.6",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "requests-html>=0.10.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
futbol-model = "futbol_model:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
